name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Trigger khi push tag dạng v1.0.0, v1.2.3, ...
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub Actions tab

permissions:
  contents: write   # Cần để tạo release và upload assets

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Tạo self-signed certificate từ secret (nếu có)
      #    Nếu không có secret CSC_LINK thì build không ký
      - name: Setup code signing certificate
        if: ${{ secrets.CSC_BASE64 != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "certs" -Force | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.CSC_BASE64 }}")
          [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
          Write-Host "Certificate restored from secret"

      # 5. Build Vite
      - name: Build Vite (React)
        run: npm run build

      # 6. Build Electron app
      - name: Build Electron (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — chỉ dùng nếu có secret
          CSC_LINK: ${{ secrets.CSC_BASE64 != '' && 'certs/code-signing.pfx' || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      # 7. Lấy version từ package.json
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      # 8. Tìm file output
      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem dist-electron -Recurse -Include "*.exe","*.zip" | Select-Object Name, Length

      # 9. Upload artifacts (lưu tạm để download)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          retention-days: 30

      # 10. Tạo GitHub Release (chỉ khi push tag)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXClient v${{ steps.version.outputs.VERSION }}
          body: |
            ## VoxelXClient v${{ steps.version.outputs.VERSION }}

            ### Cài đặt
            - **VoxelXClient-Setup-${{ steps.version.outputs.VERSION }}.exe** — Installer (khuyến nghị)
            - **VoxelXClient-${{ steps.version.outputs.VERSION }}.exe** — Portable (không cần cài đặt)

            ### Yêu cầu hệ thống
            - Windows 10/11 (64-bit)
            - Kết nối internet để tải Minecraft

            ### Lưu ý
            > App dùng self-signed certificate. Windows SmartScreen có thể hiện cảnh báo lần đầu.
            > Click **"More info"** → **"Run anyway"** để tiếp tục.
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
