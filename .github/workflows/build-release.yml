name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Download Electron binary
        run: npx electron --version

      - name: Setup code signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.CSC_BASE64 }}
        run: |
          if ($env:CSC_BASE64) {
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            $bytes = [Convert]::FromBase64String($env:CSC_BASE64)
            [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
            Write-Host "Certificate restored from secret"
          } else {
            Write-Host "No certificate secret found, building without signing"
          }

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $certPath = "certs/code-signing.pfx"
          if (Test-Path $certPath) {
            $env:CSC_LINK = $certPath
            Write-Host "Building with code signing"
          } else {
            Write-Host "Building without code signing"
          }
          npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            rpm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --x64 --publish never

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ── Create Release (after both builds) ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: release-files/linux

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXClient v${{ steps.version.outputs.VERSION }}
          body: |
            ## VoxelXClient v${{ steps.version.outputs.VERSION }}

            <div align="center">
            <br/>
            <img src="https://raw.githubusercontent.com/foxstudio-201/VoxelXClient/main/public/icon.png" width="80" height="80" alt="VoxelXClient Logo" />
            <h1>VoxelXClient</h1>
            <p><strong>The Ultimate Minecraft Launcher</strong><br/>Manage profiles, install mods, and launch any Minecraft version — all in one place.</p>
            <p>
            <img src="https://img.shields.io/badge/version-${{ steps.version.outputs.VERSION }}-4ade80?style=flat-square&labelColor=0a0a0a" alt="Version" />
            <img src="https://img.shields.io/badge/platform-Windows%20%7C%20Linux-blue?style=flat-square&labelColor=0a0a0a" alt="Platform" />
            <img src="https://img.shields.io/badge/electron-42-47848F?style=flat-square&labelColor=0a0a0a&logo=electron" alt="Electron" />
            <img src="https://img.shields.io/badge/react-19-61DAFB?style=flat-square&labelColor=0a0a0a&logo=react" alt="React" />
            <img src="https://img.shields.io/badge/license-MIT-22c55e?style=flat-square&labelColor=0a0a0a" alt="License" />
            </p>
            <p>
            <a href="https://voxelxclient.vercel.app">🌐 Website</a> &nbsp;·&nbsp;
            <a href="https://join.foxstudio.site">💬 Discord</a>
            </p>
            </div>

            > Bản cập nhật lớn tập trung vào **Server Manager** — quản lý server Minecraft trực tiếp trong launcher, không cần công cụ ngoài.

            ---

            ### 🖥️ Server Console — Tái cấu trúc hoàn toàn

            - Console hiển thị màu ANSI và ký hiệu `§` đầy đủ, đúng encoding UTF-8
            - Lọc log theo mức độ: `ALL` / `INFO` / `WARN` / `ERROR`
            - Auto-scroll thông minh, nút copy toàn bộ log
            - Giao diện chia tab: **Console · Files · Network**

            ---

            ### 📁 File Manager — Quản lý file server

            - Duyệt toàn bộ thư mục server với cây thư mục đầy đủ
            - Double-click file để mở **Code Editor** với highlight cú pháp, số dòng, cuộn đồng bộ
            - Lưu / Huỷ với hiệu ứng trượt mượt
            - Checkbox chọn nhiều file/folder để **xoá hàng loạt**
            - Nén file thành `.zip`, giải nén trực tiếp trong launcher
            - Kéo thả hoặc dùng nút **Add** để upload file lên server

            ---

            ### 🌐 Network Tab — Kết nối từ xa

            - Hiển thị **IP nội bộ** (LAN) và **IP công cộng** kèm port
            - Tích hợp **bore tunnel** — tạo địa chỉ công cộng không cần port forwarding, không cần tài khoản
            - Tự động tải `bore` binary (~6MB) lần đầu sử dụng
            - Trạng thái tunnel giữ nguyên khi chuyển tab
            - Nút copy địa chỉ tunnel một chạm để chia sẻ cho bạn bè

            ---

            ### ⚙️ Profile Settings — Cải tiến

            - Sửa lỗi tab Worlds không load được danh sách thế giới
            - Sửa lỗi Shaders / Resource Packs không lấy được icon từ Modrinth API
            - RAM slider hiển thị đúng track màu
            - Truyền đúng object profile sau khi cập nhật

            ---

            ### 🔧 Sửa lỗi khác

            - Tắt DevTools trong bản production
            - Sửa lỗi nút xoá server bị che bởi `overflow-hidden`
            - Sửa lỗi `Identifier 'app' has already been declared` trong `serverManager.cjs`
            - Sửa encoding UTF-8 cho stdout/stderr server (dùng `StringDecoder`)
            - Thêm JVM flags `-Dfile.encoding=UTF-8` để hiển thị đúng tiếng Việt trong console

            ---

            ### 📦 Download

            | Nền tảng | File | Ghi chú |
            |----------|------|---------|
            | Windows | `VoxelXClient Setup ${{ steps.version.outputs.VERSION }}.exe` | Installer (khuyến nghị) |
            | Windows | `VoxelXClient ${{ steps.version.outputs.VERSION }}.exe` | Portable, không cần cài |
            | Linux | `VoxelXClient-${{ steps.version.outputs.VERSION }}.AppImage` | Chạy trực tiếp |
            | Linux | `voxelxclient_${{ steps.version.outputs.VERSION }}_amd64.deb` | Debian / Ubuntu |

            > **Yêu cầu:** Windows 10/11 (64-bit) hoặc Linux x64
            > ⚠️ Windows: SmartScreen có thể cảnh báo lần đầu — nhấn **More info** → **Run anyway**
            > 🐧 Linux AppImage: `chmod +x VoxelXClient*.AppImage && ./VoxelXClient*.AppImage`
          files: |
            release-files/windows/*.exe
            release-files/windows/*.zip
            release-files/linux/*.AppImage
            release-files/linux/*.deb
            release-files/linux/*.rpm
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
