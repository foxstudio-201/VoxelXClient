name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Restore certificate từ secret (nếu có)
      - name: Setup code signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.CSC_BASE64 }}
        run: |
          if ($env:CSC_BASE64) {
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            $bytes = [Convert]::FromBase64String($env:CSC_BASE64)
            [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
            Write-Host "Certificate restored from secret"
          } else {
            Write-Host "No certificate secret found, building without signing"
          }

      - name: Build Vite
        run: npm run build

      - name: Build Electron
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $certPath = "certs/code-signing.pfx"
          if (Test-Path $certPath) {
            $env:CSC_LINK = $certPath
            Write-Host "Building with code signing"
          } else {
            Write-Host "Building without code signing"
          }
          npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "dist-electron") {
            Get-ChildItem dist-electron -Recurse -Include "*.exe","*.zip" | Select-Object Name, Length
          } else {
            Write-Host "dist-electron not found"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXClient v${{ steps.version.outputs.VERSION }}
          body: |
            ## VoxelXClient v${{ steps.version.outputs.VERSION }}

            ### Tải xuống
            - **VoxelXClient Setup x.x.x.exe** — Installer (khuyến nghị)
            - **VoxelXClient x.x.x.exe** — Portable (không cần cài đặt)

            ### Yêu cầu
            - Windows 10/11 (64-bit)
            - Kết nối internet để tải Minecraft

            > ⚠️ Nếu Windows SmartScreen hiện cảnh báo: click **More info** → **Run anyway**
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
