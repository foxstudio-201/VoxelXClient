name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Download Electron binary
        run: npx electron --version

      - name: Setup code signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.CSC_BASE64 }}
        run: |
          if ($env:CSC_BASE64) {
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            $bytes = [Convert]::FromBase64String($env:CSC_BASE64)
            [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
            Write-Host "Certificate restored from secret"
          } else {
            Write-Host "No certificate secret found, building without signing"
          }

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $certPath = "certs/code-signing.pfx"
          if (Test-Path $certPath) {
            $env:CSC_LINK = $certPath
            Write-Host "Building with code signing"
          } else {
            Write-Host "Building without code signing"
          }
          npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            rpm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --x64 --publish never

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ── Create Release (after both builds) ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: release-files/linux

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXClient 
          body: |
            ## VoxelXClient 

            ### Windows
            - **VoxelXClient Setup x.x.x.exe** — Installer (recommended)
            - **VoxelXClient x.x.x.exe** — Portable (no install needed)

            ### Linux
            - **VoxelXClient-x.x.x.AppImage** — Universal (run anywhere)
            - **voxelxclient_x.x.x_amd64.deb** — Debian/Ubuntu

            ### Requirements
            - Windows 10/11 (64-bit) or Linux x64
            - Internet connection to download Minecraft

            > ⚠️ Windows: SmartScreen may warn on first run — click **More info** → **Run anyway**
            > 🐧 Linux AppImage: `chmod +x VoxelXClient*.AppImage && ./VoxelXClient*.AppImage`
          files: |
            release-files/windows/*.exe
            release-files/windows/*.zip
            release-files/linux/*.AppImage
            release-files/linux/*.deb
            release-files/linux/*.rpm
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
