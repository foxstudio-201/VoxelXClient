name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Generate app secret
        run: node scripts/gen-app-secret.cjs

      - name: Fix BOM in package.json
        shell: pwsh
        run: |
          $file = "package.json"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $content = [System.Text.Encoding]::UTF8.GetString($bytes, 3, $bytes.Length - 3)
            $utf8NoBom = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllText($file, $content, $utf8NoBom)
            Write-Host "Removed BOM from package.json"
          } else {
            Write-Host "No BOM in package.json"
          }

      - name: Download Electron binary
        run: npx electron --version

      - name: Setup code signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.CSC_BASE64 }}
        run: |
          if ($env:CSC_BASE64) {
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            $bytes = [Convert]::FromBase64String($env:CSC_BASE64)
            [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
            Write-Host "Certificate restored from secret"
          } else {
            Write-Host "No certificate secret found, building without signing"
          }

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $certPath = "certs/code-signing.pfx"
          if (Test-Path $certPath) {
            $env:CSC_LINK = $certPath
            Write-Host "Building with code signing"
          } else {
            Write-Host "Building without code signing"
          }
          npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXLauncher-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            rpm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Generate app secret
        run: node scripts/gen-app-secret.cjs

      - name: Fix BOM in package.json
        run: |
          python3 -c "
          import sys
          with open('package.json', 'rb') as f:
              data = f.read()
          if data[:3] == b'\\xef\\xbb\\xbf':
              with open('package.json', 'wb') as f:
                  f.write(data[3:])
              print('Removed BOM from package.json')
          else:
              print('No BOM in package.json')
          "

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --x64 --publish never

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXLauncher-Linux-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ── Create Release (after both builds) ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXLauncher-Windows-${{ steps.version.outputs.VERSION }}
          path: release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXLauncher-Linux-${{ steps.version.outputs.VERSION }}
          path: release-files/linux

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXLauncher
          body: |
            ## VoxelXLauncher v${{ steps.version.outputs.VERSION }}

            <div align="center">
            <br/>
            <img src="https://raw.githubusercontent.com/foxstudio-201/VoxelXLauncher/main/public/icon.png" width="80" height="80" alt="VoxelXLauncher Logo" />
            <h1>VoxelXLauncher</h1>
            <p><strong>The Ultimate Minecraft Launcher</strong><br/>Manage profiles, install mods, and launch any Minecraft version — all in one place.</p>
            <p>
            <img src="https://img.shields.io/badge/version-${{ steps.version.outputs.VERSION }}-4ade80?style=flat-square&labelColor=0a0a0a" alt="Version" />
            <img src="https://img.shields.io/badge/Windows-0078D4?style=flat-square&labelColor=0a0a0a&logo=windows11&logoColor=0078D4" alt="Windows" />
            <img src="https://img.shields.io/badge/Linux-FCC624?style=flat-square&labelColor=0a0a0a&logo=linux&logoColor=FCC624" alt="Linux" />
            <img src="https://img.shields.io/badge/electron-42-47848F?style=flat-square&labelColor=0a0a0a&logo=electron" alt="Electron" />
            <img src="https://img.shields.io/badge/react-19-61DAFB?style=flat-square&labelColor=0a0a0a&logo=react" alt="React" />
            <img src="https://img.shields.io/badge/license-MIT-22c55e?style=flat-square&labelColor=0a0a0a" alt="License" />
            </p>
            <p>
            <a href="https://voxelxclient.vercel.app">🌐 Website</a> &nbsp;·&nbsp;
            <a href="https://join.foxstudio.site">💬 Discord</a>
            </p>
            </div>

            > Bản cập nhật tập trung vào **đồng bộ tài khoản**, **hỗ trợ đăng nhập Gmail**, **thêm ngôn ngữ mới**, **fix bảo mật** và **cải thiện cửa sổ crash log**.

            ---

            ### 👤 Tài khoản & Xác thực

            - **Đồng bộ tài khoản khi tạo**: Tài khoản mới được đồng bộ ngay lập tức với hệ thống khi tạo
            - **Đăng nhập Gmail / Google**: Hỗ trợ đăng nhập bằng tài khoản Gmail — dùng được cả trên web lẫn trong launcher
            - **Đăng nhập bằng mật khẩu**: Hỗ trợ đăng nhập bằng email + mật khẩu trên web và launcher
            - **Cập nhật thông tin tài khoản**: Có thể cập nhật email, mật khẩu trực tiếp trong launcher

            ---

            ### 🌐 Ngôn ngữ

            - **Thêm ngôn ngữ mới**: Hỗ trợ thêm ngôn ngữ trong phần cài đặt
            - **i18n cho Profile Settings**: Toàn bộ phần cài đặt profile (Mods, Shaders, Resource Packs, Worlds, Files) đã hỗ trợ đa ngôn ngữ
            - **i18n cho Crash Modal**: Cửa sổ phân tích crash đã hỗ trợ đa ngôn ngữ

            ---

            ### 🔒 Bảo mật

            - **Fix bảo mật IPC**: Cải thiện validation đầu vào cho các IPC handler
            - **Guard instancePath**: Xử lý an toàn khi profile thiếu đường dẫn thư mục
            - **Fix race condition crash modal**: Đọc logs từ ref thay vì state để tránh mất dữ liệu khi game crash nhanh

            ---

            ### 💥 Crash Log

            - **Cửa sổ crash log chi tiết**: Khi game crash, launcher tự động hiện modal phân tích lỗi
            - **Phân tích Fabric FormattedException**: Đọc và hiển thị rõ ràng `net.fabricmc.loader.impl.FormattedException` — liệt kê mod xung đột, giải pháp đề xuất
            - **Tự động tìm và cài mod thiếu**: Tìm kiếm Modrinth và đề xuất cài đặt mod bị thiếu ngay trong modal
            - **Hiển thị exit code**: Hiện exit code của game khi crash

            ---

            ### 🔧 Sửa lỗi khác

            - **Fix toggle mod**: Sửa lỗi bật/tắt mod bị mất tên file sau khi toggle
            - **Fix profile settings crash**: Sửa lỗi `ERR_INVALID_ARG_TYPE` khi bật/tắt mod trong profile settings

            ---

            ### ⬇️ Download

            | Nền tảng | File | Ghi chú |
            |----------|------|---------|
            | 🪟 Windows | `VoxelXLauncher Setup ${{ steps.version.outputs.VERSION }}.exe` | Installer (khuyến nghị) |
            | 🪟 Windows | `VoxelXLauncher ${{ steps.version.outputs.VERSION }}.exe` | Portable, không cần cài |
            | 🐧 Linux | `VoxelXLauncher-${{ steps.version.outputs.VERSION }}.AppImage` | Chạy trực tiếp |
            | 🐧 Linux | `voxelxlauncher_${{ steps.version.outputs.VERSION }}_amd64.deb` | Debian / Ubuntu |

            > **Yêu cầu:** Windows 10/11 (64-bit) hoặc Linux x64
            > ⚠️ Windows: SmartScreen có thể cảnh báo lần đầu — nhấn **More info** → **Run anyway**
            > 🐧 Linux AppImage: `chmod +x VoxelXLauncher*.AppImage && ./VoxelXLauncher*.AppImage`
          files: |
            release-files/windows/*.exe
            release-files/windows/*.zip
            release-files/linux/*.AppImage
            release-files/linux/*.deb
            release-files/linux/*.rpm
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
