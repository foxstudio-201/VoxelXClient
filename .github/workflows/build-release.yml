name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Download Electron binary
        run: npx electron --version

      - name: Setup code signing certificate
        shell: pwsh
        env:
          CSC_BASE64: ${{ secrets.CSC_BASE64 }}
        run: |
          if ($env:CSC_BASE64) {
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            $bytes = [Convert]::FromBase64String($env:CSC_BASE64)
            [IO.File]::WriteAllBytes("certs/code-signing.pfx", $bytes)
            Write-Host "Certificate restored from secret"
          } else {
            Write-Host "No certificate secret found, building without signing"
          }

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $certPath = "certs/code-signing.pfx"
          if (Test-Path $certPath) {
            $env:CSC_LINK = $certPath
            Write-Host "Building with code signing"
          } else {
            Write-Host "Building without code signing"
          }
          npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            rpm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --linux --x64 --publish never

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ── Create Release (after both builds) ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Windows-${{ steps.version.outputs.VERSION }}
          path: release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoxelXClient-Linux-${{ steps.version.outputs.VERSION }}
          path: release-files/linux

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxelXClient v${{ steps.version.outputs.VERSION }}
          body: |
            ## VoxelXClient v${{ steps.version.outputs.VERSION }}

            <div align="center">
            <br/>
            <img src="https://raw.githubusercontent.com/foxstudio-201/VoxelXClient/main/public/icon.png" width="80" height="80" alt="VoxelXClient Logo" />
            <h1>VoxelXClient</h1>
            <p><strong>The Ultimate Minecraft Launcher</strong><br/>Manage profiles, install mods, and launch any Minecraft version — all in one place.</p>
            <p>
            <img src="https://img.shields.io/badge/version-${{ steps.version.outputs.VERSION }}-4ade80?style=flat-square&labelColor=0a0a0a" alt="Version" />
            <img src="https://img.shields.io/badge/Windows-0078D4?style=flat-square&labelColor=0a0a0a&logo=windows11&logoColor=0078D4" alt="Windows" />
            <img src="https://img.shields.io/badge/Linux-FCC624?style=flat-square&labelColor=0a0a0a&logo=linux&logoColor=FCC624" alt="Linux" />
            <img src="https://img.shields.io/badge/electron-42-47848F?style=flat-square&labelColor=0a0a0a&logo=electron" alt="Electron" />
            <img src="https://img.shields.io/badge/react-19-61DAFB?style=flat-square&labelColor=0a0a0a&logo=react" alt="React" />
            <img src="https://img.shields.io/badge/license-MIT-22c55e?style=flat-square&labelColor=0a0a0a" alt="License" />
            </p>
            <p>
            <a href="https://voxelxclient.vercel.app">🌐 Website</a> &nbsp;·&nbsp;
            <a href="https://join.foxstudio.site">💬 Discord</a>
            </p>
            </div>

            > Bản cập nhật tập trung vào **Server Manager** — quản lý server Minecraft hoàn chỉnh ngay trong launcher với plugin, mod, cài đặt, whitelist và ban list.

            ---

            ### 🖥️ Server Console

            - Tab-complete lệnh Minecraft với 60+ lệnh gợi ý theo ngữ cảnh
            - Tự động thêm `/` — chỉ cần gõ tên lệnh
            - Realtime RAM/CPU từ process thực tế (pidusage), không còn hardcode
            - RAM bar hiển thị đúng theo `-Xmx`, không vượt 100%
            - IP nội bộ hiển thị ngay trên panel, nút copy một chạm
            - Nếu bore tunnel đang bật → hiện địa chỉ tunnel thay thế

            ---

            ### � Plugins & Mods Tab

            - Tab **Plugins**: sub-tab Modrinth + Spigot với icon riêng
            - Tab **Mods**: tìm kiếm mod từ Modrinth
            - Tự động filter loader theo loại server (Paper → bukkit/spigot/paper, Fabric → fabric/quilt...)
            - Modal chọn phiên bản: bộ lọc release/beta/alpha cố định trên header, không scroll cùng list
            - Loader tags màu sắc theo từng loại
            - Tải plugin/mod thẳng vào thư mục `plugins/` hoặc `mods/` của server

            ---

            ### ⚙️ Settings Tab (mới)

            - **Cấu hình**: MOTD, Max Players, Port, Gamemode, Difficulty, Level Name
            - Toggle: Online Mode, Whitelist, PvP
            - RAM slider, CPU Cores, JVM Arguments, Java Path
            - Custom dropdown thay thế `<select>` native
            - **Whitelist**: thêm/xoá player, checkbox chọn nhiều, avatar player
            - **Banned**: danh sách ban với countdown thời gian, auto-unban khi hết hạn, unban hàng loạt

            ---

            ### 🃏 Server Card

            - Icon lớn hơn, tên to hơn
            - Hiện ping ms (TCP), player count realtime, RAM/Cores
            - Ping bars màu theo latency

            ---

            ### 🔧 Sửa lỗi & Cải tiến

            - Sidebar: icon Server thay Globe, label "Server" thay "Worlds"
            - Tắt DevTools trong bản production
            - Version splash screen lấy từ Electron IPC (luôn đúng sau update)
            - Sửa encoding UTF-8 console server
            - Sửa lỗi preload `onServerLog` bị mất khai báo

            ---

            ### 📦 Download

            | Nền tảng | File | Ghi chú |
            |----------|------|---------|
            | 🪟 Windows | `VoxelXClient Setup ${{ steps.version.outputs.VERSION }}.exe` | Installer (khuyến nghị) |
            | 🪟 Windows | `VoxelXClient ${{ steps.version.outputs.VERSION }}.exe` | Portable, không cần cài |
            | 🐧 Linux | `VoxelXClient-${{ steps.version.outputs.VERSION }}.AppImage` | Chạy trực tiếp |
            | 🐧 Linux | `voxelxclient_${{ steps.version.outputs.VERSION }}_amd64.deb` | Debian / Ubuntu |

            > **Yêu cầu:** Windows 10/11 (64-bit) hoặc Linux x64
            > ⚠️ Windows: SmartScreen có thể cảnh báo lần đầu — nhấn **More info** → **Run anyway**
            > 🐧 Linux AppImage: `chmod +x VoxelXClient*.AppImage && ./VoxelXClient*.AppImage`
          files: |
            release-files/windows/*.exe
            release-files/windows/*.zip
            release-files/linux/*.AppImage
            release-files/linux/*.deb
            release-files/linux/*.rpm
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
